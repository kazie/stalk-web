name: TypeScript canary

# TypeScript major updates are ignored in dependabot.yml until vue-tsc supports them.
# This checks monthly whether the latest TypeScript + vue-tsc type-check cleanly,
# and opens an issue when they do so the ignore can be removed.

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install latest TypeScript and vue-tsc
        id: versions
        run: |
          pnpm install --frozen-lockfile
          pnpm add -D typescript@latest vue-tsc@latest
          echo "typescript=$(node -p "require('typescript/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "vue-tsc=$(node -p "require('vue-tsc/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Type-check
        run: pnpm type-check

      - name: Open issue
        if: ${{ !startsWith(steps.versions.outputs.typescript, '6.') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TS_VERSION: ${{ steps.versions.outputs.typescript }}
          VUE_TSC_VERSION: ${{ steps.versions.outputs.vue-tsc }}
        run: |
          title="TypeScript $TS_VERSION now works with vue-tsc"
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body "The TypeScript canary passed with typescript@$TS_VERSION and vue-tsc@$VUE_TSC_VERSION.

          Remove the typescript ignore in \`.github/dependabot.yml\` and upgrade. Once done, this canary workflow can be deleted (or kept for the next major)."
          fi
